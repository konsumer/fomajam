# Builds the firmware and publishes the site (emulator, installer, rescue) to GitHub Pages.
# Settings -> Pages -> Source: GitHub Actions. Every run keeps the .fwsc and the USB MIDI host box's .uf2
# (CC.md) as a "firmware" artifact; tags (v0.2) also get a release with them attached, and the site has the .uf2.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./fm1 build
      - run: ./tools/usbhost/build.sh && cp build/fomajam-usbhost.uf2 build/web/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build/web
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/*.fwsc
            build/fomajam-usbhost.uf2
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            build/*.fwsc
            build/fomajam-usbhost.uf2
          fail_on_unmatched_files: true
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
